name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two loaders are two independent Gradle builds, one per directory - there is no
        # gradlew at the repository root, so each one is built from inside its own folder.
        loader: [neoforge, fabric]
    name: ${{ matrix.loader }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` also runs the unit tests. The optional physics-structure compatibility layer
      # (Sable / Create) simply stays out of the build when those mods are not installed, which
      # is the normal case on a runner - see neoforge/build.gradle.
      - name: Build with Gradle
        working-directory: ${{ matrix.loader }}
        run: ./gradlew build
