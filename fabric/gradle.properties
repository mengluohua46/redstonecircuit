# Fabric build properties - THIS FILE IS FABRIC'S OWN.
#
# The two loaders version and ship INDEPENDENTLY (author, 2026-09-28): fabric starts its own line at
# 1.0.0 while neoforge continues 1.1.x, and neither number follows the other. The loader/Minecraft pins
# live in each module's own build.gradle too.
#
# Only what this build actually reads is kept here. The copy of the NeoForge file this replaced also
# carried neo_version / loader_version_range / minecraft_version_range / parchment_* / jade_version /
# mod_name / mod_license / mod_authors / mod_description - none of which any part of the fabric build,
# the fabric mod metadata or the fabric tests reads (fabric.mod.json hardcodes the name, authors,
# licence and description). A version file that looks shared is how the two lines drift back together.

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# The Minecraft version this build compiles against (build.gradle's `minecraft` dependency).
minecraft_version=1.21.1

# The mod id: the jar is named after it (`<mod_id>-fabric`), and it is the namespace every resource and
# mixin config in this module lives under.
mod_id=redstonecircuit

# FABRIC'S OWN MOD VERSION. Independent of neoforge's `mod_version` (1.1.x): bump this one only for a
# fabric release, and neoforge's only for a neoforge release.
mod_version=1.0.0

# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
mod_group_id=com.jiangyuefengyu.redstonecircuit
