plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    //
    // Jade (玉) is an optional, client-side compatibility target: only its API is compiled against,
    // nothing of it is bundled, and the mod runs perfectly well without it installed.
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // Create's own Maven. Kept for completeness only - see the note on the physics-compat jars
    // below, which are wired as local files instead.
    maven {
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'com.simibubi.create'
        }
    }
}

// --- optional "physics structure" compatibility targets -------------------------------------------
//
// Sable / Create / Create Aeronautics are SOFT dependencies for the physics-structure work. The
// parts of their API we may eventually call are compiled against so the code type-checks, but
//
//   * nothing of theirs is bundled into our jar,
//   * nothing of theirs is required at runtime, and
//   * every entry point stays behind a ModList.get().isLoaded(...) gate,
//
// so "installed" and "not installed" behave identically.
//
// They are wired as LOCAL FILES rather than as Maven coordinates on purpose. Publishable Modrinth
// Aero artifacts do exist, but their file names are not the coordinate-versioned ones Gradle asks
// for (Sable publishes e.g. `maven.modrinth:sable:W6v45c9C`, a Modrinth *version id*, and Create
// Aeronautics ships as a nested-jar "bundled" archive), so pinning this mod's build to whatever
// those hashed names happen to be is a worse trade than a path that is obviously local. These jars
// are used for compilation only and are never looked for at runtime; a missing path is skipped with
// a log line, so a fresh clone still builds. Sable is the one exception: its file name carries Sable's
// own version, which moves independently of this mod's, so that jar is found by prefix below instead
// of being pinned to a name somebody has to keep in step.
def physicsCompatJars = [
        // Create 6.0.10 - contraption / mounted-storage hooks live under com.simibubi.create.
        'D:/MC mod/红石电路/模组/[机械动力] create-1.21.1-6.0.10.jar',
        // Create Aeronautics 1.3.2 - a "bundled" jar; its real code is nested in
        // META-INF/jarjar/{aeronautics,simulated,offroad}.jar and is NOT on this classpath. It
        // contributes nothing but its mod metadata, which is exactly why the Aeronautics side of the
        // compatibility layer records its findings in prose instead of asserting them in code.
        'D:/MC mod/红石电路/模组/[机械动力：航空学] create-aeronautics-bundled-1.21.1-1.3.2.jar',
]

physicsCompatJars.each { path ->
    if (file(path).exists()) {
        dependencies.add('compileOnly', files(path))
    } else {
        logger.lifecycle("[redstonecircuit] optional compat jar not found, skipping (compileOnly): ${path}")
    }
}

// Sable's public API is split across two jars: `dev.ryanhcode.sable.api.*` lives in Sable's own mod
// jar (found by prefix above), while the position-to-sub-level lookup the whole design hinges on lives
// in `dev.ryanhcode.sable.companion.*`, which Sable ships as a nested jar
// (META-INF/jarjar/sable-companion-common-<version>.jar). Gradle's compileOnly on the mod jar does
// not see nested jars, and there is no Maven coordinate for this one.
//
// `net.createmod.catnip.*` (the "ponder" library Create nests inside its own jar) is needed for the
// same reason: Create's ContraptionWorld extends catnip's WrappedLevel, and Java resolves the whole
// supertype chain before it will let you assign the result to anything - even to BlockGetter, which
// it already is.
//
// Both are third-party code redistributed inside somebody else's mod, so they are not committed into
// neoforge/libs/: they are unpacked at build time from the mods the developer has installed, into
// build/physics-libs/, and wired in as compileOnly exactly like the mod jars above. See
// neoforge/libs/README.md.
//
// The search order is "already unpacked, else nested":
//   1. a file with the wanted name lying loose in physicsModsDir (flat);
//   2. otherwise META-INF/jarjar/<wanted name> inside any *.jar in physicsModsDir.
def physicsModsDirPath = (project.findProperty('physicsModsDir') ?: 'D:/MC mod/红石电路/模组').toString()
def physicsModsDirFile = new File(physicsModsDirPath)
def physicsLibsDirFile = layout.buildDirectory.dir('physics-libs').get().asFile

// The two nested jars, described by a prefix and a suffix rather than a regex: Gradle's Groovy
// `==~` turned out to be a poor fit here (it silently failed to match a plain glob), and prefix and
// suffix are exactly what "a version goes in the middle" means anyway.
def physicsNeeded = [
        [label: 'sable-companion-common', prefix: 'sable-companion-common-', suffix: '.jar'],
        [label: 'ponder', prefix: 'ponder-', suffix: '.jar'],
]

/** True when a file name is one of the two nested jars we need. */
def isNeededPhysicsJar = { String name ->
    physicsNeeded.any { spec -> name.startsWith(spec.prefix) && name.endsWith(spec.suffix) }
}

/** Newest file in physicsModsDir whose name starts with a prefix and ends with a suffix, or null. */
def latestPhysicsCandidate = { String prefix, String suffix ->
    if (!physicsModsDirFile.isDirectory()) {
        return null
    }
    def matches = physicsModsDirFile.listFiles(
            { File f -> f.isFile() && f.name.startsWith(prefix) && f.name.endsWith(suffix) } as FileFilter)
    matches == null || matches.length == 0 ? null : matches.sort { it.name }.last()
}

// Sable - the sub-level library (public API package: dev.ryanhcode.sable.api), found by prefix for the
// reason above: `sable-neoforge-<minecraft>-<sable version>.jar` carries two versions that both move, and
// pinning either is a build that breaks on the next update. Newest by name wins, like the nested jars.
def sableModJar = latestPhysicsCandidate('sable-neoforge-', '.jar')
if (sableModJar != null) {
    dependencies.add('compileOnly', files(sableModJar))
    logger.lifecycle("[redstonecircuit] physics compat compileOnly: ${sableModJar}  " +
            "(source: physicsModsDir)")
} else {
    logger.lifecycle("[redstonecircuit] optional compat jar not found, skipping (compileOnly): " +
            "sable-neoforge-*.jar in ${physicsModsDirFile}")
}

// Which of the two nested jars are already lying loose in physicsModsDir, and which still have to be
// dug out of a mod jar.
def physicsLooseSources = [:]
def physicsExtractPrefixes = []
physicsNeeded.each { spec ->
    def loose = latestPhysicsCandidate(spec.prefix, spec.suffix)
    if (loose != null) {
        physicsLooseSources[loose.name] = loose
    } else {
        physicsExtractPrefixes << spec.prefix
    }
}

// The names the compile classpath will use, whether they come from a loose file or a nested entry.
def physicsNestedNames = []
if (!physicsExtractPrefixes.isEmpty() && physicsModsDirFile.isDirectory()) {
    physicsModsDirFile.listFiles({ File f -> f.isFile() && f.name.toLowerCase().endsWith('.jar') } as FileFilter)
            ?.sort { it.name }
            ?.each { outer ->
                def zip = new java.util.zip.ZipFile(outer)
                try {
                    zip.entries().each { entry ->
                        if (entry.name.startsWith('META-INF/jarjar/') && entry.name.endsWith('.jar')) {
                            def base = entry.name.substring(entry.name.lastIndexOf('/') + 1)
                            if (isNeededPhysicsJar(base) && !physicsNestedNames.contains(base)
                                    && !physicsLooseSources.containsKey(base)) {
                                physicsNestedNames << base
                            }
                        }
                    }
                } finally {
                    zip.close()
                }
            }
}

def physicsRequiredLibNames = (physicsLooseSources.keySet() + physicsNestedNames).unique().sort()
// Sable's mod jar is part of the same requirement, not a convenience: its API package is what the compat
// source set compiles against, so a machine without it leaves the source set out instead of failing.
def physicsRequiredLibsMissing = physicsRequiredLibNames.isEmpty() || sableModJar == null
def physicsModsDirExists = physicsModsDirFile.isDirectory()

tasks.register('extractNestedPhysicsLibs') {
    group = 'build setup'
    description = 'Unpacks the nested Sable-companion / Create-ponder jars out of the locally ' +
            'installed mods into build/physics-libs/ for compileOnly use. Skipped when missing.'
    // Declared even when they do not exist yet: Gradle only resolves these when the task actually
    // runs, and the task is skipped in that case anyway.
    inputs.files(physicsLooseSources.values() + physicsModsDirFile.listFiles(
            { File f -> f.isFile() && f.name.toLowerCase().endsWith('.jar') } as FileFilter)?.toList() ?: [])
    outputs.dir(physicsLibsDirFile)
    // The task must run whenever there is anything usable at all: a loose jar still has to be copied
    // into build/physics-libs/, and a nested one still has to be extracted. It is only skipped when
    // neither form was found, in which case the compat source set is excluded anyway.
    onlyIf { !physicsRequiredLibNames.isEmpty() && physicsModsDirExists }
    doLast {
        def copied = 0
        physicsLooseSources.each { name, source ->
            def target = new File(physicsLibsDirFile, name)
            if (!target.isFile()) {
                physicsLibsDirFile.mkdirs()
                java.nio.file.Files.copy(source.toPath(), target.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                copied++
            }
        }
        if (!physicsExtractPrefixes.isEmpty()) {
            physicsModsDirFile.listFiles({ File f -> f.isFile() && f.name.toLowerCase().endsWith('.jar') } as FileFilter)
                    ?.sort { it.name }
                    ?.each { outer ->
                        def zip = new java.util.zip.ZipFile(outer)
                        try {
                            zip.entries().each { entry ->
                                if (!entry.name.startsWith('META-INF/jarjar/') || !entry.name.endsWith('.jar')) {
                                    return
                                }
                                def base = entry.name.substring(entry.name.lastIndexOf('/') + 1)
                                if (!isNeededPhysicsJar(base)) {
                                    return
                                }
                                def target = new File(physicsLibsDirFile, base)
                                if (target.isFile()) {
                                    return
                                }
                                physicsLibsDirFile.mkdirs()
                                zip.getInputStream(entry).withStream { input ->
                                    java.nio.file.Files.copy(input, target.toPath(),
                                            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                                }
                                copied++
                            }
                        } finally {
                            zip.close()
                        }
                    }
        }
        logger.lifecycle("[redstonecircuit] physicsModsDir=${physicsModsDirFile} " +
                "-> build/physics-libs/ (${copied} jar(s) written, ${physicsRequiredLibNames.size()} usable)")
    }
}

// The optional compat source set. Everything that names a Sable or Create type lives here, so that
// a machine with no mods installed can simply not compile it; `PhysicsCompat` in the main source
// set is the only thing the rest of the mod knows about, and it reaches this code by name so the
// two halves never have to be compiled together.
sourceSets {
    compat {
        java.srcDir 'src/compat/java'
    }
}
dependencies {
    if (!physicsRequiredLibsMissing) {
        physicsRequiredLibNames.each { name ->
            def source = physicsLooseSources[name] ?: "META-INF/jarjar in a mod jar"
            logger.lifecycle("[redstonecircuit] physics compat compileOnly: " +
                    "${new File(physicsLibsDirFile, name)}  (source: ${source})")
            compatCompileOnly files(new File(physicsLibsDirFile, name))
        }
        // Only the main *classes*, never `sourceSets.main.output`: that carries a builtBy on the
        // `classes` lifecycle task, and `classes` depends on the compat compiler, which would make
        // the two depend on each other. The jar and the run configurations pick the compat output up
        // separately, below.
        compatCompileOnly files(sourceSets.main.output.classesDirs) {
            builtBy tasks.named('compileJava')
        }
    }
}
// ModDevGradle puts Minecraft on the main source set's classpath only (same reason the test source
// set below inherits it by hand), so the compat source set inherits the whole thing - including the
// optional mod jars - from main.
sourceSets.compat.compileClasspath += sourceSets.main.compileClasspath
tasks.named('compileCompatJava', JavaCompile) {
    dependsOn 'extractNestedPhysicsLibs'
    options.encoding = 'UTF-8'
}
if (physicsRequiredLibsMissing) {
    tasks.named('compileCompatJava', JavaCompile) {
        enabled = false
    }
    def missing = []
    if (sableModJar == null) {
        missing << 'sable-neoforge-*.jar'
    }
    if (physicsRequiredLibNames.isEmpty()) {
        missing << 'sable-companion-common-*.jar / ponder-*.jar'
    }
    logger.lifecycle("[redstonecircuit] nothing found for ${missing.join(' and ')} in " +
            "${physicsModsDirFile}; the optional physics-compat source set is excluded from this build " +
            "(see neoforge/libs/README.md).")
}

// Both source sets end up in the mod jar: the compat classes are inert unless Sable/Create are
// actually installed, and PhysicsCompat only reaches them by name. They are added to the `jar` task
// directly instead of to `sourceSets.main.output`, because the latter would put a builtBy on the
// `classes` lifecycle task and `classes` already depends on the compat compiler.
tasks.named('jar', Jar) {
    if (!physicsRequiredLibsMissing) {
        from sourceSets.compat.output
    }
    // The released file name carries the version AND the loader it is for. Gradle's default is
    // `<mod_id>-<version>.jar`, which says neither which loader nor which Minecraft line the jar is
    // built for, so the whole name is written out here. Only the file name changes: the mod version
    // inside neoforge.mods.toml still comes from `mod_version`.
    archiveFileName = "${mod_id}-${mod_version}-neoforge-${minecraft_version}.jar"
}

// The GameTest server runs from the assembled mod, not from the class directories, so it needs no
// special wiring here. The one thing that does: with no compat source set there is nothing to look
// for, and `PhysicsCompat` reports that honestly instead of pretending.

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // The optional physics-compat classes are part of the same mod, just compiled
            // separately so a machine without the optional mods can skip them entirely.
            if (!physicsRequiredLibsMissing) {
                sourceSet(sourceSets.compat)
            }
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // Jade's API, for the optional overlay that shows our own repeaters' settings. compileOnly: the
    // published jar neither contains Jade nor asks for it, and the plugin is discovered by Jade only
    // when a player has it installed.
    compileOnly "maven.modrinth:jade:${jade_version}"
    // In the development environment only, so the overlay can actually be tried out while building it.
    // 'localRuntime' keeps it out of anything a dependent would resolve.
    localRuntime "maven.modrinth:jade:${jade_version}"
}

// A RELEASE package logs lightly by default; a build made for development keeps the detailed log.
// `-Prelease` (or `-Prelease=true`) marks the jar; BuildFlags reads the marker and RCConfig takes its
// debugLog default from it. Everything else about the two builds is identical.
var releaseBuild = project.hasProperty('release') && project.property('release') != 'false'
logger.lifecycle("[redstonecircuit] build mode: {} (debugLog default {})",
        releaseBuild ? 'RELEASE - light log by default' : 'development - detailed log by default',
        releaseBuild ? 'false' : 'true')

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            release                : releaseBuild,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// --- unit tests ---------------------------------------------------------------------------
// Pure-logic tests for the data layer (NBT round-trips, placement ordering, host rules...).
// These run on the JVM without launching Minecraft, so they are fast and catch the kind of
// regressions that are tedious to find in-game.
//
// ModDevGradle puts Minecraft on the MAIN source set's classpath only, so the test source set
// has to inherit it explicitly - otherwise the tests cannot even see net.minecraft.* classes.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

// --- split-package guard -------------------------------------------------------------------------
//
// NeoForge puts every mod jar into one JPMS module layer, and **two modules may not export the same
// package**. If any class of ours lands in a package another mod already owns, module resolution
// fails before a single line of our code runs:
//
//   java.lang.module.ResolutionException: Modules redstonecircuit and sablecompanion
//       export package dev.ryanhcode.sable.companion to module lanserverproperties
//
// That is not hypothetical - it is exactly how this mod once failed to start, because a helper of
// ours was declared in Sable's own package to save an import. No runtime guard can defend against
// it (the failure happens at module resolution, before `ModList` exists), so it is checked at build
// time instead, and the check is wired into `check` so `build` runs it too.
//
// Two directions are covered:
//   * the assembled jar must contain no entry in another mod's namespace, and no `.class` outside
//     `com/jiangyuefengyu/redstonecircuit/` at all;
//   * the *sources* must obey the same rule, because a stray source file is not compiled (and so not
//     seen in the jar) on a machine where the optional compat source set is excluded.

// Namespaces owned by the mods this project optionally integrates with, as jar-entry prefixes.
// Listed literally rather than "anything that is not ours", so a failure can name the owner.
def thirdPartyNamespaces = [
        'dev/ryanhcode/'  : 'Sable',
        'com/simibubi/'   : 'Create',
        'dev/eriksonn/'   : 'Create Aeronautics / Simulated',
        'net/createmod/'  : 'Create catnip', // Create's ponder / wrapped-level library
        'com/jozufozu/'   : 'Flywheel (legacy package layout)',
        'dev/engine_room/': 'Flywheel 1.0',
]

// Everything the task body needs is captured here, at configuration time: reading `project` while the
// task executes is rejected when the configuration cache is on (and this build has it on).
def ourPackagePrefix = 'com/jiangyuefengyu/redstonecircuit'
def ourPackagePath = "${ourPackagePrefix}/"
def ourPackageDotted = ourPackagePrefix.replace('/', '.')
def javaSourceRoots = file('src').listFiles()
        ?.collect { new File(it, 'java') }
        ?.findAll { it.isDirectory() }
        ?: []

tasks.register('verifyNoSplitPackages') {
    group = 'verification'
    description = 'Fails when the mod jar - or the sources it is built from - puts one of our ' +
            'classes into a package another mod owns (a JPMS split package, which crashes the game ' +
            'at module resolution before any of our code runs).'

    def jarTask = tasks.named('jar', Jar)
    def jarArchive = jarTask.flatMap { it.archiveFile }
    dependsOn jarTask
    inputs.file(jarArchive)
    inputs.files(fileTree('src') { include '*/java/**/*.java' })

    doLast {
        def problems = []

        // ---- 1. the assembled jar ------------------------------------------------------------
        def jarFile = jarArchive.get().asFile
        def scanned = 0
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            zip.entries().each { entry ->
                scanned++
                def name = entry.name
                def owner = thirdPartyNamespaces.find { prefix, mod -> name.startsWith(prefix) }
                if (owner != null) {
                    problems << "jar entry ${name} is in ${owner.key}, which belongs to ${owner.value}"
                } else if (name.endsWith('.class') && !name.startsWith(ourPackagePath)) {
                    problems << "jar entry ${name} is a class outside ${ourPackagePath}"
                }
            }
        } finally {
            zip.close()
        }

        // ---- 2. the sources (catches a stray file the jar cannot show) ------------------------
        def sourceFiles = 0
        javaSourceRoots.each { javaDir ->
            javaDir.eachFileRecurse { file ->
                if (!file.isFile() || !file.name.endsWith('.java')) {
                    return
                }
                sourceFiles++
                def relative = javaDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                if (!relative.startsWith(ourPackagePath)) {
                    problems << "source ${file} lives in a directory outside ${ourPackagePath}"
                }
                def declaration = file.withReader('UTF-8') { reader ->
                    reader.readLine()
                }
                // A missing package declaration is fine (default package); anything else must be ours
                // or one of its sub-packages - `com.jiangyuefengyu.redstonecircuitfoo` is not ours.
                if (declaration != null && declaration.startsWith('package ')) {
                    def declared = declaration.substring('package '.length()).trim()
                    if (declared.endsWith(';')) {
                        declared = declared.substring(0, declared.length() - 1)
                    }
                    if (declared != ourPackageDotted && !declared.startsWith("${ourPackageDotted}.")) {
                        problems << "source ${file} declares '${declared}', which is not ours"
                    }
                }
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException("split-package guard failed (${problems.size()} problem(s)):\n  "
                    + problems.join('\n  ')
                    + "\n\nOur classes only ever live under ${ourPackagePath}. If a package-private member of "
                    + "another mod is genuinely needed, use a Mixin @Accessor/@Invoker with a string "
                    + "targets= plus an IMixinConfigPlugin gatekeeper (see SodiumMixinPlugin), never a "
                    + "class of ours inside somebody else's package.")
        }
        logger.lifecycle("[redstonecircuit] verifyNoSplitPackages: OK - ${scanned} jar entries in "
                + "${jarFile.name}, ${sourceFiles} source file(s) checked, 0 third-party namespace "
                + "entries (${thirdPartyNamespaces.size()} namespace(s) watched).")
    }
}

tasks.named('check') {
    dependsOn 'verifyNoSplitPackages'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// The test suite keeps the DETAILED log even in a release build (`-Prelease` only changes what a
// released jar defaults to). One property, read by RCConfig#debugLog, is also the supported way to ask
// a released jar for a diagnostic log:
//     -Dredstonecircuit.debugLog=true
tasks.named('test', Test) {
    systemProperty 'redstonecircuit.debugLog', 'true'
}