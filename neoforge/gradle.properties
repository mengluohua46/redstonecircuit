# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact.
# This is BOTH the compile target and the minimum the built jar asks for (the mods.toml template
# writes versionRange="[${neo_version},)"), so it has to stay at the lowest version actually built and
# tested - compiling against a newer one while claiming an older one is how a jar ends up with a
# NoSuchMethodError on a version it said it supported.
neo_version=21.1.100
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Jade (玉) - OPTIONAL client-side compatibility only. The API is used at compile time so our three
# repeaters can show their setting in Jade's overlay; the built jar contains none of it, does not
# depend on it, and the mod is fully playable without it. Compiled against 15.10.6+neoforge, which is
# the current 1.21.1 NeoForge build; the API used here has been stable across the whole 15.x line.
jade_version=15.10.6+neoforge

# Where the locally installed Sable / Create mods live. `gradlew` unpacks the two *nested* jars the
# optional physics-compat layer compiles against (Sable's `sable-companion-common-*.jar` and Create's
# `ponder-*.jar`) out of them into build/physics-libs/ - they are third-party code, so they are not
# committed to this repository. Both a loose inner jar lying in this folder and a nested
# `META-INF/jarjar/` entry inside a mod jar are accepted. If neither is found the build still
# succeeds and simply leaves the optional compat source set out.
#
# NOTE: Gradle reads this file as ISO-8859-1, exactly like the mod_name above - raw UTF-8 here would
# be mangled into mojibake and the folder would not be found. Non-ASCII is therefore written as
# \uXXXX escapes, which the Properties loader turns back into real characters. This value is
# D:/MC mod/红石电路/模组 and can be overridden per-machine with -PphysicsModsDir=... on the command
# line (build.gradle also understands a raw UTF-8 value passed that way).
physicsModsDir=D:/MC mod/\u7EA2\u77F3\u7535\u8DEF/\u6A21\u7EC4

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=redstonecircuit
# The human-readable display name for the mod.
# NOTE: Gradle parses .properties files as ISO-8859-1, so raw UTF-8 here would be mangled into
# mojibake in the generated neoforge.mods.toml. Keep non-ASCII values in \uXXXX escape form;
# the Properties loader turns them back into real characters, and the TOML is written as UTF-8.
mod_name=\u7EA2\u77F3\u7535\u8DEF
# The license for you mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
# NEOFORGE'S OWN VERSION LINE - the two loaders version and ship INDEPENDENTLY:
# neoforge continues 1.1.x here while fabric has its own line in fabric/gradle.properties. Bump this one
# only for a neoforge release.
mod_version=1.2.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.jiangyuefengyu.redstonecircuit
# Author(s) shown in the mod list (江月风雨)
mod_authors=\u6C5F\u6708\u98CE\u96E8
# Short description shown in the mod list
mod_description=Put redstone components inside blocks, then see them with the redstone goggles. / \u628A\u7EA2\u77F3\u5143\u4EF6\u653E\u8FDB\u65B9\u5757\u5185\u90E8\uFF0C\u5E76\u7528\u7EA2\u77F3\u773C\u955C\u770B\u89C1\u5B83\u4EEC\u3002
